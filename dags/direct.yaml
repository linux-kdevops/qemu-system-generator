description: >-
  Build a NixOS closure with the latest kernel for each of the microvm
  machines bootstrap-direct and bootstrap-direct-peer, boot it directly with the
  host's Nix store over virtiofs, log in, leave a file in the shared home,
  and have each machine ping the other.
working_dir: ..
type: chain
env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    # Stop every machine, even after one fails to stop.
    run: >-
      status=0;
      for vm in bootstrap-direct bootstrap-direct-peer; do
      steps/machine/stop --name $vm || status=1; done;
      exit $status

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: direct_install_bootstrap_direct
    run: steps/direct/install --name bootstrap-direct

  - id: direct_build_bootstrap_direct
    run: steps/direct/build --name bootstrap-direct

  - id: direct_install_bootstrap_direct_peer
    run: steps/direct/install --name bootstrap-direct-peer

  - id: direct_build_bootstrap_direct_peer
    run: steps/direct/build --name bootstrap-direct-peer

  - id: generator_run
    run: steps/generator/run

  - id: machine_start_bootstrap_direct
    run: steps/machine/start --name bootstrap-direct

  - id: machine_start_bootstrap_direct_peer
    run: steps/machine/start --name bootstrap-direct-peer

  # The guest answers once its sshd runs; until then the step fails.
  - id: machine_wait_bootstrap_direct
    run: steps/machine/wait --name bootstrap-direct
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: machine_wait_bootstrap_direct_peer
    run: steps/machine/wait --name bootstrap-direct-peer
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: direct_check
    run: steps/direct/check

  - id: machine_remove_bootstrap_direct
    run: steps/machine/remove --name bootstrap-direct

  - id: machine_remove_bootstrap_direct_peer
    run: steps/machine/remove --name bootstrap-direct-peer
