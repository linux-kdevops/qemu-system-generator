# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Build two kernels and QEMU from their release tarballs and a knix
  imageless NixOS guest, boot bootstrap-knix through a BusyBox
  initramfs and bootstrap-knix-peer through the guest's own initrd, log in, and have each machine
  ping the other.
working_dir: ..
type: chain
env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    # Stop every machine, even after one fails to stop.
    run: >-
      status=0;
      for vm in bootstrap-knix bootstrap-knix-peer; do
      steps/machine/stop --name $vm || status=1; done;
      exit $status

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: knix_install
    run: steps/knix/install

  - id: knix_build
    run: steps/knix/build

  - id: generator_run
    run: steps/generator/run

  - id: machine_start_bootstrap_knix
    run: steps/machine/start --name bootstrap-knix

  - id: machine_start_bootstrap_knix_peer
    run: steps/machine/start --name bootstrap-knix-peer

  # The guest answers once its sshd runs; until then the step fails.
  - id: machine_wait_bootstrap_knix
    run: steps/machine/wait --name bootstrap-knix
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: machine_wait_bootstrap_knix_peer
    run: steps/machine/wait --name bootstrap-knix-peer
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: knix_check
    run: steps/knix/check

  - id: machine_remove_bootstrap_knix
    run: steps/machine/remove --name bootstrap-knix

  - id: machine_remove_bootstrap_knix_peer
    run: steps/machine/remove --name bootstrap-knix-peer
