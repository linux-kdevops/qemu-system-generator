# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Clone a kernel and QEMU release, build each with make in knix's shell
  for it and add it to the Nix store, build a knix imageless NixOS guest
  with the devel profile, boot bootstrap-knix through a BusyBox
  initramfs and bootstrap-knix-peer through the guest's own initrd, both
  on that kernel, log in, and have each machine ping the other.
working_dir: ..
type: chain
env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    # Stop every machine, even after one fails to stop.
    run: >-
      status=0;
      for vm in bootstrap-knix bootstrap-knix-peer; do
      steps/machine/stop --name $vm || status=1; done;
      exit $status

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: knix_install_guest
    run: steps/knix/install_guest

  - id: knix_clone_linux
    run: steps/knix/clone --name linux

  - id: knix_clone_kfragments
    run: steps/knix/clone --name kfragments

  - id: knix_build_kernel
    run: steps/knix/build_kernel
    with:
      shell: nix develop ./steps/knix#build-kernel --ignore-env --keep-env-var HOME --command bash

  - id: knix_add_kernel
    run: steps/knix/add_kernel

  - id: knix_clone_qemu
    run: steps/knix/clone --name qemu

  - id: knix_build_qemu
    run: steps/knix/build_qemu
    with:
      shell: nix develop ./steps/knix#build-qemu --ignore-env --keep-env-var HOME --command bash

  - id: knix_add_qemu
    run: steps/knix/add_qemu

  - id: knix_build_guest
    run: steps/knix/build_guest

  - id: knix_install_bootstrap_knix
    run: steps/knix/install --name bootstrap-knix

  - id: knix_install_bootstrap_knix_peer
    run: steps/knix/install --name bootstrap-knix-peer

  - id: generator_run
    run: steps/generator/run

  - id: machine_start_bootstrap_knix
    run: steps/machine/start --name bootstrap-knix

  - id: machine_start_bootstrap_knix_peer
    run: steps/machine/start --name bootstrap-knix-peer

  # The guest answers once its sshd runs; until then the step fails.
  - id: machine_wait_bootstrap_knix
    run: steps/machine/wait --name bootstrap-knix
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: machine_wait_bootstrap_knix_peer
    run: steps/machine/wait --name bootstrap-knix-peer
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: knix_check
    run: steps/knix/check

  - id: machine_remove_bootstrap_knix
    run: steps/machine/remove --name bootstrap-knix

  - id: machine_remove_bootstrap_knix_peer
    run: steps/machine/remove --name bootstrap-knix-peer
