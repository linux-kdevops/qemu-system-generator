# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Follow one guide of docs/bootstrap/ on this host, as a person would, and
  check the machines it leaves: start them, run every ssh command the guide
  shows, and stop them.
working_dir: ..

params:
  # disk, uki, kernel, knix or cloud.
  - name: guide
    default: kernel
  # The machines the guide writes, space-separated: bootstrap, bootstrap
  # peer for kernel and knix, or cloud-debian cloud-fedora cloud-ubuntu
  # for the cloud guide.
  - name: names
    default: bootstrap

env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
  - SSH_DIR: ${HOME}/bootstrap/ssh

steps:
  - id: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/host/check --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: cpus

  - id: key
    depends: host
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/ssh/generate_key --dir "$SSH_DIR" --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: key

  - id: generator
    depends: key
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/generator/install --flake . --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: generator

  - id: remove
    depends: generator
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/machine/remove --name "${params.names}"

  # The guide starts from an empty host: knix clones into its directory
  # and runs nix flake init there, which refuse a filled one.
  - id: clean
    depends: remove
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/guide/clean --dir "$HOME/bootstrap/${params.guide}"

  # docs/bootstrap/host.rst writes what every guide uses: the workspace
  # and the SSH configuration that names each guide's machines.
  - id: prepare
    depends: clean
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/guide/run --guide docs/bootstrap/host.rst
      --key ${steps.key.outputs.key}
      --script "$HOME/bootstrap/steps/host.sh" --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: script

  - id: follow
    depends: prepare
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/guide/run --guide docs/bootstrap/${params.guide}.rst
      --key ${steps.key.outputs.key}
      --script "$HOME/bootstrap/steps/${params.guide}.sh" --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: script

  - id: start
    depends: follow
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/machine/start --config "$SSH_DIR/config"
      --name "${params.names}" --timeout 600

  - id: check
    depends: start
    run: >-
      nix develop --ignore-env --keep-env-var HOME
      --command steps/guide/check --guide docs/bootstrap/${params.guide}.rst
      --config "$SSH_DIR/config" --output "$DAGU_OUTPUT_FILE"
    outputs:
      - name: checks

  - id: stop
    depends: check
    run: >-
      nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
      --command steps/machine/stop --name "${params.names}"
