# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Build a NixOS EFI disk image, boot it as the bootstrap machine with
  OVMF, and log in to it.
working_dir: ..
type: chain
queue: bootstrap

env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    run: steps/machine/stop --name bootstrap

steps:
  - id: check_host
    run: steps/host/check

  - id: generate_key
    run: steps/ssh/generate_key

  - id: install_host
    run: steps/host/install

  - id: install_generator
    run: steps/generator/install

  - id: install
    run: steps/disk/install

  - id: build
    run: steps/disk/build

  - id: start
    run: steps/machine/start --name bootstrap

  # The guest answers once its sshd runs; until then the step fails.
  - id: wait
    run: steps/machine/wait --name bootstrap
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: check
    run: steps/disk/check
