# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Boot bootstrap-runner, an Ubuntu 26.04 guest sized as GitHub's
  ubuntu-latest runner, with its runner user, and set its OS up with the
  runner-images scripts that built ubuntu-latest. Then run this
  checkout's .github/workflows/bootstrap.yaml in it with act, every job
  in the guest itself and one after another, so that a job which would
  fail on ubuntu-latest, say for a package the image lacks, fails here.
working_dir: ..
type: chain
env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    run: steps/machine/stop --name bootstrap-runner

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: runner_fetch
    run: steps/runner/fetch

  - id: runner_install
    run: steps/runner/install

  - id: runner_build
    run: steps/runner/build

  - id: generator_run
    run: steps/generator/run

  - id: machine_start
    run: steps/machine/start --name bootstrap-runner

  - id: machine_wait
    run: steps/machine/wait --name bootstrap-runner
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: runner_provision
    run: steps/runner/provision

  # The Packer template's scripts, in its order, that set up apt and its
  # packages, limits, sysctls and the environment, and Node.js, which act
  # runs JavaScript actions with; its others install toolchains no step
  # uses. The template restarts the machine after them.
  - id: runner_setup_configure_apt_mock
    run: steps/runner/setup --name configure-apt-mock

  - id: runner_setup_install_ms_repos
    run: steps/runner/setup --name install-ms-repos

  - id: runner_setup_configure_apt_sources
    run: steps/runner/setup --name configure-apt-sources

  - id: runner_setup_configure_apt
    run: steps/runner/setup --name configure-apt

  - id: runner_setup_configure_limits
    run: steps/runner/setup --name configure-limits

  - id: runner_setup_configure_image_data
    run: steps/runner/setup --name configure-image-data

  - id: runner_setup_configure_environment
    run: steps/runner/setup --name configure-environment

  - id: runner_setup_install_apt_vital
    run: steps/runner/setup --name install-apt-vital

  - id: runner_setup_install_apt_common
    run: steps/runner/setup --name install-apt-common

  - id: runner_setup_install_nodejs
    run: steps/runner/setup --name install-nodejs

  - id: runner_setup_configure_dpkg
    run: steps/runner/setup --name configure-dpkg

  - id: runner_setup_cleanup
    run: steps/runner/setup --name cleanup

  - id: runner_setup_configure_system
    run: steps/runner/setup --name configure-system

  - id: machine_start_reboot
    run: steps/machine/start --name bootstrap-runner

  - id: machine_wait_reboot
    run: steps/machine/wait --name bootstrap-runner
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: runner_install_act
    run: steps/runner/install_act

  - id: runner_install_checkout
    run: steps/runner/install_checkout

  - id: runner_run
    run: steps/runner/run

  - id: machine_remove
    run: steps/machine/remove --name bootstrap-runner
