# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Fetch the Debian, Fedora and Ubuntu cloud images, write their cloud-init
  seeds, boot the three machines, log in, and have Debian and Fedora ping
  each other.
working_dir: ..
type: chain

env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    # Stop every machine, even after one fails to stop.
    run: >-
      status=0;
      for vm in cloud-debian cloud-fedora cloud-ubuntu; do
      steps/machine/stop --name $vm || status=1; done;
      exit $status

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: cloud_fetch_debian
    run: steps/cloud/fetch --distro debian --version 14

  - id: cloud_fetch_fedora
    run: steps/cloud/fetch --distro fedora --version 44

  - id: cloud_fetch_ubuntu
    run: steps/cloud/fetch --distro ubuntu --version 26.10

  - id: cloud_install
    run: steps/cloud/install

  - id: cloud_build
    run: steps/cloud/build

  - id: machine_start_cloud_debian
    run: steps/machine/start --name cloud-debian

  - id: machine_start_cloud_fedora
    run: steps/machine/start --name cloud-fedora

  - id: machine_start_cloud_ubuntu
    run: steps/machine/start --name cloud-ubuntu

  # The guest answers once its sshd runs; until then the step fails.
  # cloud-init's first boot grows the disk and makes the host keys.
  - id: machine_wait_cloud_debian
    run: steps/machine/wait --name cloud-debian
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: machine_wait_cloud_fedora
    run: steps/machine/wait --name cloud-fedora
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: machine_wait_cloud_ubuntu
    run: steps/machine/wait --name cloud-ubuntu
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: cloud_check
    run: steps/cloud/check
