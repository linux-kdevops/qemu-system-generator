# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Fetch the Debian, Fedora and Ubuntu cloud images, write their cloud-init
  seeds, and boot each distribution's machine with its peer, one pair at a
  time: log in, and have the two ping each other.
working_dir: ..
type: chain

env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    # Stop every machine, even after one fails to stop.
    run: >-
      status=0;
      for vm in cloud-debian cloud-fedora cloud-ubuntu
      cloud-debian-peer cloud-fedora-peer cloud-ubuntu-peer; do
      steps/machine/stop --name $vm || status=1; done;
      exit $status

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: cloud_fetch_cloud_debian
    run: steps/cloud/fetch --name cloud-debian --version 14

  - id: cloud_install_cloud_debian
    run: steps/cloud/install --name cloud-debian --version 14

  - id: cloud_build_cloud_debian
    run: steps/cloud/build --name cloud-debian --version 14

  - id: cloud_fetch_cloud_debian_peer
    run: steps/cloud/fetch --name cloud-debian-peer --version 14

  - id: cloud_install_cloud_debian_peer
    run: steps/cloud/install --name cloud-debian-peer --version 14

  - id: cloud_build_cloud_debian_peer
    run: steps/cloud/build --name cloud-debian-peer --version 14

  - id: cloud_fetch_cloud_fedora
    run: steps/cloud/fetch --name cloud-fedora --version 44

  - id: cloud_install_cloud_fedora
    run: steps/cloud/install --name cloud-fedora --version 44

  - id: cloud_build_cloud_fedora
    run: steps/cloud/build --name cloud-fedora --version 44

  - id: cloud_fetch_cloud_fedora_peer
    run: steps/cloud/fetch --name cloud-fedora-peer --version 44

  - id: cloud_install_cloud_fedora_peer
    run: steps/cloud/install --name cloud-fedora-peer --version 44

  - id: cloud_build_cloud_fedora_peer
    run: steps/cloud/build --name cloud-fedora-peer --version 44

  - id: cloud_fetch_cloud_ubuntu
    run: steps/cloud/fetch --name cloud-ubuntu --version 26.10

  - id: cloud_install_cloud_ubuntu
    run: steps/cloud/install --name cloud-ubuntu --version 26.10

  - id: cloud_build_cloud_ubuntu
    run: steps/cloud/build --name cloud-ubuntu --version 26.10

  - id: cloud_fetch_cloud_ubuntu_peer
    run: steps/cloud/fetch --name cloud-ubuntu-peer --version 26.10

  - id: cloud_install_cloud_ubuntu_peer
    run: steps/cloud/install --name cloud-ubuntu-peer --version 26.10

  - id: cloud_build_cloud_ubuntu_peer
    run: steps/cloud/build --name cloud-ubuntu-peer --version 26.10

  - id: generator_run
    run: steps/generator/run

  - id: machine_start_cloud_debian
    run: steps/machine/start --name cloud-debian

  - id: machine_start_cloud_debian_peer
    run: steps/machine/start --name cloud-debian-peer

  # The guest answers once its sshd runs; until then the step fails.
  # cloud-init's first boot grows the disk and makes the host keys.
  - id: machine_wait_cloud_debian
    run: steps/machine/wait --name cloud-debian
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: machine_wait_cloud_debian_peer
    run: steps/machine/wait --name cloud-debian-peer
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: cloud_check_cloud_debian
    run: steps/cloud/check --name cloud-debian

  - id: machine_stop_cloud_debian
    run: steps/machine/stop --name cloud-debian

  - id: machine_stop_cloud_debian_peer
    run: steps/machine/stop --name cloud-debian-peer

  - id: machine_start_cloud_fedora
    run: steps/machine/start --name cloud-fedora

  - id: machine_start_cloud_fedora_peer
    run: steps/machine/start --name cloud-fedora-peer

  - id: machine_wait_cloud_fedora
    run: steps/machine/wait --name cloud-fedora
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: machine_wait_cloud_fedora_peer
    run: steps/machine/wait --name cloud-fedora-peer
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: cloud_check_cloud_fedora
    run: steps/cloud/check --name cloud-fedora

  - id: machine_stop_cloud_fedora
    run: steps/machine/stop --name cloud-fedora

  - id: machine_stop_cloud_fedora_peer
    run: steps/machine/stop --name cloud-fedora-peer

  - id: machine_start_cloud_ubuntu
    run: steps/machine/start --name cloud-ubuntu

  - id: machine_start_cloud_ubuntu_peer
    run: steps/machine/start --name cloud-ubuntu-peer

  - id: machine_wait_cloud_ubuntu
    run: steps/machine/wait --name cloud-ubuntu
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: machine_wait_cloud_ubuntu_peer
    run: steps/machine/wait --name cloud-ubuntu-peer
    retry_policy:
      limit: 120
      interval_sec: 5

  - id: cloud_check_cloud_ubuntu
    run: steps/cloud/check --name cloud-ubuntu

  - id: machine_stop_cloud_ubuntu
    run: steps/machine/stop --name cloud-ubuntu

  - id: machine_stop_cloud_ubuntu_peer
    run: steps/machine/stop --name cloud-ubuntu-peer
