# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Build a NixOS closure for bootstrap-packages from a flake whose overlay
  builds fio 3.43 with gnuplot, t/io_uring and a patch from upstream,
  xfstests from its for-next branch with that fio, and damo, nfstest,
  pynfs and the xdrlib3 library pynfs needs, which nixpkgs lacks. Boot it
  directly with the host's Nix store and home over virtiofs and run each
  tool in the guest.
working_dir: ..
type: chain
env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    run: steps/machine/stop --name bootstrap-packages

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: packages_install
    run: steps/packages/install

  - id: packages_build
    run: steps/packages/build

  - id: generator_run
    run: steps/generator/run

  - id: machine_start
    run: steps/machine/start --name bootstrap-packages

  # The guest answers once its sshd runs; until then the step fails.
  - id: machine_wait
    run: steps/machine/wait --name bootstrap-packages
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: packages_check
    run: steps/packages/check

  - id: machine_remove
    run: steps/machine/remove --name bootstrap-packages
