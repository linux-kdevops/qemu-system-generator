description: >-
  Build a NixOS closure with the latest kernel, boot it directly as the
  microvm machines bootstrap and peer with the host's Nix store over
  virtiofs, log in, pass a file each way through a share, and have each
  machine ping the other.
working_dir: ..
type: chain
queue: bootstrap

env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    # Stop every machine, even after one fails to stop.
    run: >-
      status=0;
      for vm in bootstrap peer; do
      steps/machine/stop --name $vm || status=1; done;
      exit $status

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: kernel_install
    run: steps/kernel/install

  - id: kernel_build
    run: steps/kernel/build

  - id: generator_run
    run: steps/generator/run

  - id: machine_start_bootstrap
    run: steps/machine/start --name bootstrap

  - id: machine_start_peer
    run: steps/machine/start --name peer

  # The guest answers once its sshd runs; until then the step fails.
  - id: machine_wait_bootstrap
    run: steps/machine/wait --name bootstrap
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: machine_wait_peer
    run: steps/machine/wait --name peer
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: kernel_check
    run: steps/kernel/check
