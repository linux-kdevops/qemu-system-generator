# SPDX-License-Identifier: copyleft-next-0.3.1
description: >-
  Build a NixOS unified kernel image on an EFI system partition, boot it
  as the bootstrap-uki machine with OVMF and the host's Nix store over
  virtiofs, log in, and pass a file each way through a share.
working_dir: ..
type: chain
env:
  - XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}

handler_on:
  exit:
    run: steps/machine/stop --name bootstrap-uki

steps:
  - id: host_check
    run: steps/host/check

  - id: ssh_generate_key
    run: steps/ssh/generate_key

  - id: host_install
    run: steps/host/install

  - id: generator_install
    run: steps/generator/install

  - id: uki_install
    run: steps/uki/install

  - id: uki_build
    run: steps/uki/build

  - id: generator_run
    run: steps/generator/run

  - id: machine_start
    run: steps/machine/start --name bootstrap-uki

  # The guest answers once its sshd runs; until then the step fails.
  - id: machine_wait
    run: steps/machine/wait --name bootstrap-uki
    retry_policy:
      limit: 60
      interval_sec: 5

  - id: uki_check
    run: steps/uki/check
