# 80 columns, as .markdownlint-cli2.jsonc sets it for Markdown.
# D000 parses each page alone, before docs/conf.py has rendered the man
# pages docs/man/ includes; sphinx-build --fail-on-warning checks validity.
[doc8]
max-line-length = 80
ignore = D000
ignore-path = docs/_build,docs/_generated
