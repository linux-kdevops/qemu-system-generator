#
# Applies to every fstests-*.qemu: the machine, the kernel and the test
# and scratch devices. Drop-in lines follow the file's own lines on the
# command line.

[QEMU]
machine=q35
accel=kvm
cpu=host
m=8G
smp=8
kernel=/srv/kernel/bzImage
drive=file=root.qcow2,if=virtio,format=qcow2
drive=file=test.qcow2,if=none,format=qcow2,id=test
device=nvme,serial=test,drive=test
drive=file=scratch.qcow2,if=none,format=qcow2,id=scratch
device=nvme,serial=scratch,drive=scratch
nic=user,model=virtio-net-pci-non-transitional
device=virtio-rng-pci-non-transitional
nographic=
serial=mon:stdio
no-reboot=
