# SPDX-License-Identifier: copyleft-next-0.3.1
# Every guide of docs/bootstrap/ followed on a GitHub-hosted runner, one job
# each, through the same dagu start a developer runs (notes/steps.md). The
# runner is a throwaway VM, so steps/github/prepare_runner does the one-time
# root setup there; everything after it runs as the runner user.
name: bootstrap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - guide: disk
            names: bootstrap
          - guide: uki
            names: bootstrap
          - guide: kernel
            names: bootstrap peer
          - guide: knix
            names: bootstrap peer
          - guide: cloud
            names: cloud-debian cloud-fedora cloud-ubuntu
    name: ${{ matrix.guide }}
    steps:
      - uses: actions/checkout@v5

      - id: runner
        run: steps/github/prepare_runner --output "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Follow the guide
        env:
          XDG_RUNTIME_DIR: ${{ steps.runner.outputs.xdg_runtime_dir }}
        run: >-
          nix develop .#steps --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml start bootstrap --
          guide=${{ matrix.guide }} "names=${{ matrix.names }}"

      - name: Show the run
        if: always()
        env:
          XDG_RUNTIME_DIR: ${{ steps.runner.outputs.xdg_runtime_dir }}
        run: >-
          nix develop .#steps --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml status bootstrap

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.guide }}-logs
          path: |
            ~/.local/state/qemu-system-generator/dagu/logs
            ~/bootstrap/steps
          if-no-files-found: ignore
