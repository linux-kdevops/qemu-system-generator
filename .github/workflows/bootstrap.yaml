# SPDX-License-Identifier: copyleft-next-0.3.1
# Every DAG under dags/ on a GitHub-hosted runner, one job each, through the
# same dagu start a person runs. The runner is a throwaway VM, so
# steps/github/prepare_runner does the one-time root setup there;
# everything after it runs as the runner user.
name: bootstrap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dag: [disk, uki, direct, knix, cloud]
    name: ${{ matrix.dag }}
    steps:
      - uses: actions/checkout@v5

      - id: runner
        run: steps/github/prepare_runner --output "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the DAG
        env:
          XDG_RUNTIME_DIR: ${{ steps.runner.outputs.xdg_runtime_dir }}
        run: >-
          nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml start ${{ matrix.dag }}

      - name: Show the run
        if: always()
        env:
          XDG_RUNTIME_DIR: ${{ steps.runner.outputs.xdg_runtime_dir }}
        run: >-
          nix develop --ignore-env --keep-env-var HOME --keep-env-var XDG_RUNTIME_DIR
          --command dagu --config config.yaml status ${{ matrix.dag }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.dag }}-logs
          path: ~/.local/state/qemu-system-generator/dagu/logs
          if-no-files-found: ignore
