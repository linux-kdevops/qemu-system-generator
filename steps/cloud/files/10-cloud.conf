[QEMU]
machine=q35
accel=kvm
cpu=host
m=2G
smp=2
nographic=
serial=mon:stdio
drive=file=seed.iso,if=virtio,format=raw,readonly=on
nic=user,model=virtio-net-pci-non-transitional

[virtiofsd]
shared-dir=%h
tag=home
sandbox=namespace
uid-map=:0:%U:1:
gid-map=:0:%G:1:
