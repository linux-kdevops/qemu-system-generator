# SPDX-License-Identifier: copyleft-next-0.3.1
[Distribution]
Distribution=debian
Release=testing

[Output]
Output=bootstrap
OutputDirectory=mkosi.output

[Content]
Bootable=yes
KernelCommandLine=console=ttyS0
Locale=C.UTF-8
Keymap=us
Timezone=UTC
Hostname=bootstrap-mkosi
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        openssh-server
        acl
        attr
        bc
        gawk
        psmisc
BuildPackages=
        build-essential
        debhelper
        gettext
        libacl1-dev
        libaio-dev
        libblkid-dev
        libcap-dev
        libdevmapper-dev
        libedit-dev
        libgdbm-compat-dev
        libgdbm-dev
        libicu-dev
        libinih-dev
        libtool-bin
        liburcu-dev
        liburing-dev
        pkgconf
        systemd-dev
        uuid-dev
        xfslibs-dev
VolatilePackages=xfsprogs

[Build]
BuildSources=
        src/xfsprogs-dev:xfsprogs-dev
        src/xfstests-dev:xfstests-dev
ToolsTree=default
ToolsTreePackages=udev
SandboxTrees=keyring/share/keyrings:/usr/share/keyrings
Incremental=yes
CacheDirectory=mkosi.cache
