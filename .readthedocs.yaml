version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # docs/conf.py renders the man pages with these.
  apt_packages:
    - scdoc
    - mandoc

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
